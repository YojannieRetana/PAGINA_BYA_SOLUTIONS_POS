<!DOCTYPE html>
<html>
<head>
  <title>Registro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

<div class="login-box">

<img src="assets/logo.png" class="logo">

<h1 class="title">Crear Cuenta</h1>

<input type="text" id="name" class="input" placeholder="Nombre">

<input type="text" id="company" class="input" placeholder="Empresa">

<select id="plan" class="input">
  <option>Básico</option>
  <option>Profesional</option>
  <option>Empresarial</option>
</select>

<input type="email" id="email" class="input" placeholder="Correo">

<input type="password" id="password" class="input" placeholder="Contraseña">

<button class="btn" onclick="register()">
Crear Cuenta
</button>

</div>

</div>

<script type="module" src="js/register.js"></script>

</body>
</html>
